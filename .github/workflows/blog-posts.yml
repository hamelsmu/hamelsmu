name: Latest blog posts
on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:       # Allows manual trigger

permissions:
  contents: write

jobs:
  update-readme-with-blog:
    name: Update README with latest blog posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://hamel.dev/index.xml"
          max_post_count: 10
          item_exec: "const ignore = ['Why I Stopped Using nbdev', 'Selecting The Right AI Evals Tool', 'Inspect AI, An OSS Python Library For LLM Evals']; if (ignore.some(t => post.title.includes(t))) return false;"
